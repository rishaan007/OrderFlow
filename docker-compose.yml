version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orderflow_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://orderflow_user:secure_orderflow_pass@postgres:5432/orderflow?schema=public
      - JWT_SECRET=production_super_secret_jwt_key_orderflow_2026
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - orderflow_net

  postgres:
    image: postgres:16-alpine
    container_name: orderflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orderflow_user
      POSTGRES_PASSWORD: secure_orderflow_pass
      POSTGRES_DB: orderflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow_user -d orderflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orderflow_net

volumes:
  pgdata:
    driver: local

networks:
  orderflow_net:
    driver: bridge
